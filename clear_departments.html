<!DOCTYPE html>
<html>
<head>
    <title>Clear Departments Data</title>
</head>
<body>
    <h1>Clear Departments Data</h1>
    <p>Click the button below to clear departments data from localStorage:</p>
    <button onclick="clearDepartments()">Clear Departments Data</button>
    <div id="result"></div>

    <script>
        function clearDepartments() {
            try {
                localStorage.removeItem('qr_system_departments');
                document.getElementById('result').innerHTML = '<p style="color: green;">✅ Departments data cleared successfully! Refresh the main application to see the new departments.</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p style="color: red;">❌ Error clearing departments data: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
